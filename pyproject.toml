[project]
name = "orms-erros-comuns"
version = "0.1.0"
description = "Talk: ORMs - Erros Comuns (Django DRF + React)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django",
    "django-silk>=5.4.3",
    "djangorestframework",
    "pandas",
    "numpy",
    "django-debug-toolbar>=6.2.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-django",
    "model-bakery",
    "ruff",
    "django-upgrade",
]

[tool.pytest.ini_options]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "backend.settings"

[tool.ruff]
target-version = "py313"
line-length = 100
fix = true
show-fixes = true

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "PIE", # misc lints
    "T20", # print statements
    "RUF", # Ruff-specific
]
ignore = [
    "E203", # whitespace before ':' (compat with formatter)
    "RUF012", # mutable default in model/serializer (desirable for Django)
]

[tool.ruff.lint.per-file-ignores]
"api/migrations/*.py" = ["E501"]
